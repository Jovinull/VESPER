vesper.activity.hint.ignite = Acender o reator dá {1}-{2} de energia/s à sua rede (mais com atividade alta) e desperta cerca de {0} máquinas antigas. Indústria mais pesada desperta mais.
vesper.activity.hint.stirring = Agitada: as ruínas brilham mais. Quanto mais pesada sua indústria quando o reator despertar, maior a resposta.
vesper.activity.hint.awakened = Desperta: o reator rende mais, mas patrulhas continuam vindo enquanto a indústria seguir pesada.
vesper.activity.help = O planeta percebe o que você constrói.\n\n[accent]Indústria em funcionamento[] (forjas, motores, montadoras, refinarias) eleva a atividade devagar, até Agitada. Tecnologia antiga eleva muito mais: um reator restaurado pode levar a bacia a Desperta.\n\n[accent]Adormecida[] (0-29): nada se move.\n[accent]Agitada[] (30-69): as ruínas brilham; a resposta do despertar será maior.\n[accent]Desperta[] (70-100): máquinas antigas saem dos portões da instalação, depois patrulhas enquanto a atividade continuar alta.\n\nToda resposta é anunciada com contagem regressiva. Um reator em funcionamento gera mais energia quanto maior a atividade: risco e recompensa vêm da mesma fonte.

