vesper.mission.victory = [accent]Primeiro Despertar concluído.[] A bacia volta ao silêncio.
vesper.mission.hold = A quinta onda está retida: as máquinas esperam a bacia despertar. Restaure o reator e acenda-o quando suas defesas estiverem prontas.
vesper.mission.hold.toast = As ondas pararam. A bacia espera pelo reator.
