vesper.resonance.bar = Resonance x{0}
vesper.pulse.incoming = Resonance pulse in {0} at your resonance machines: activity +{1}; inside, x{2} and stabilizers overloaded
vesper.pulse.active = Resonance pulse ({0} left): resonance machines inside x{1}, ordinary industry inside slowed
vesper.pulse.announce = [accent]The fault resonates.[] A pulse lands at your resonance machines in {0}s.
vesper.pulse.toast = Resonance pulse! Resonance machines inside run x{0}.
vesper.response.hint.dormant = Dormant: resonance machines at x1. Above {0} they speed up.
vesper.response.hint.stirring = Stirring: resonance machines run faster. From {0}, resonance pulses begin.
vesper.response.hint.pulses = Resonance pulses come regularly. At {0} the basin awakens and patrols begin.
vesper.response.hint.awakened = Awakened: resonance machines at their fastest, and patrols grow with the level (at most {0} hostile machines at a time). Stabilizers bring it down.
vesper.response.help = The planet notices what you build, and pays for it.\n\n[accent]What raises activity:[] working industry (up to 50) and ancient technology: a primed reactor, more once it is lit, and a surge when it ignites.\n[accent]What lowers it:[] stabilizer pylons, powered and switched on. Each one takes off less than the one before, so they quiet a base but never silence it. Tap a pylon to switch it off and save its power.\n\n[accent]What it pays:[] resonance machines (crystal extractor, experimental resonator) run faster above 30, up to twice as fast at 100. The reactor gives more power too.\n[accent]What it costs:[] from 50, resonance pulses land at your resonance machines (announced 20 s ahead): they run faster inside, the ordinary industry next to them slows down, stabilizers inside are overloaded and activity rises for a while. From 70 the basin awakens: patrols come from the gates, larger and more often the higher it goes.\n\nQuiet and slow, or loud and fast: the choice is yours.
