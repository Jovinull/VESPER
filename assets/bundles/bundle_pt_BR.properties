block.vesper-resonance-dynamo.name = Dínamo de Ressonância
block.vesper-resonance-dynamo.description = Queima núcleos de ressonância para gerar energia. Cada núcleo guarda uma carga fixa de energia; a atividade planetária e os pulsos de ressonância só deixam extraí-la mais depressa. Acompanha a carga: só queima núcleos pela energia que a sua rede realmente usa. Funcionando, conta como indústria pesada para a bacia.
block.vesper-containment-field.name = Campo de Contenção
block.vesper-containment-field.description = Afasta os pulsos de ressonância da indústria ao redor: dentro do anel, nada desacelera e nenhum estabilizador fica sobrecarregado. Não baixa a atividade. Só funciona enquanto um pulso está anunciado ou em curso: aí precisa de energia e de núcleos de ressonância, e de mais núcleos para cada pulso que absorve; sem eles, fica sobrecarregado. Em espera, não gasta nada. Toque para ligar ou desligar.
