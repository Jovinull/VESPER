vesper.objective.foundry-decide = Decide its fate: restore it into a working machine, or dismantle it for salvage (tap it)
vesper.objective.foundry-archive = Survey the Archive Terminal (north): it recovers a schematic, and wakes the guardians
vesper.objective.foundry-survive = Hold the foundry: destroy the guardians' waves

# campaign: the VESPER planet and Chapter One, The Silent Basin
planet.vesper-planet.name = VESPER
planet.vesper-planet.description = An artificial industrial world, abandoned by its builders. Its ancient systems start to wake as activity returns.
sector.vesper-first-awakening.name = First Awakening
sector.vesper-first-awakening.description = The Silent Basin, Chapter One.\nA derelict reactor waits at the end of a dead valley. Build an industry, restore the reactor and ignite it: the basin will answer.\n[lightgray]The expedition lands with its own supplies: 300 ferroprism and 120 scrap.
sector.vesper-resonance-fault.name = Resonance Fault
sector.vesper-resonance-fault.description = The Silent Basin, Chapter One.\nA fault of resonance crystal crosses the basin. Store its crystal in the core: how hard you push the planet to get it is up to you.\n[lightgray]The expedition lands with its own supplies: 900 ferroprism, 400 scrap, 120 alloy and 150 circuits.
sector.vesper-buried-foundry.name = The Buried Foundry
sector.vesper-buried-foundry.description = The Silent Basin, Chapter One.\nUnder the dust lies an excavated foundry. Survey its buried machines, restore or dismantle them, and read its archive.\n[lightgray]The expedition lands with its own supplies: 800 ferroprism, 400 scrap, 150 alloy and 200 circuits.
sector.vesper-deep-signal.name = Deep Signal
sector.vesper-deep-signal.description = Something far below the basin is answering.\n[lightgray]Not available in this version.
vesper.deep.locked = Not available in this version
vesper.requirement.unavailable = Not available in this version
vesper.requirement.archive = Read the archive of The Buried Foundry
vesper.record.reactor-seals.title = Reactor seals
vesper.record.reactor-seals.text = The reactor's seals were closed from the inside, one by one, in order. It was not abandoned by accident: someone shut it down on purpose.
vesper.record.resonance-network.title = A wider network
vesper.record.resonance-network.text = The fault does not end where the basin does. Resonance runs under it like wiring, and every machine you run sends a signal along it.
vesper.record.containment.title = Containment pattern
vesper.record.containment.text = The machines that answer do not hunt. They close in on whatever disturbs the network most, then fall quiet: a system built to contain and protect, not to attack.
vesper.record.restored-machine.title = Maintenance log
vesper.record.restored-machine.text = The restored machine kept its log. The last entry orders every recoverer in the foundry sealed, "until the lower works are quiet".
vesper.record.dismantled-machine.title = Salvage marks
vesper.record.dismantled-machine.text = Every part inside its casing carries the same mark as the reactor's seals. The foundry and the reactor were shut down by the same hands.
vesper.record.archive-index.title = Archive index
vesper.record.archive-index.text = A partial index of a sealed network: foundries, reactors and archives across the planet, all closed in the same sequence. One entry has no place, only a depth: CENTRAL CONTROL.
vesper.record.deep-signal.title = Signal from below
vesper.record.deep-signal.text = The archive's last record breaks off mid-sentence. Since the foundry woke, a signal rises from deep under the basin on the archive's own channel: part of that system is active again.
