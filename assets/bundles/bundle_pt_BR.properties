mod.vesper.description = Um planeta-máquina abandonado desperta lentamente quando sua indústria antiga volta a funcionar. Versão alfa: o planeta VESPER e o Capítulo Um da sua campanha, The Silent Basin (Jogar > Campanha, depois VESPER): Primeiro Despertar, Falha de Ressonância e A Fundição Soterrada, ligados por uma árvore tecnológica própria e pelos registros que você recupera. Os três mapas também podem ser jogados sozinhos (Jogar > Jogo Personalizado).

