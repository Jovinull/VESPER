vesper.site.ancient-recoverer.purpose = [accent]Ancient Recoverer.[] A builders' refinery that turns conductive scrap and resonance crystal into resonance cores, with no circuits.
vesper.site.archive-terminal.purpose = [accent]Archive Terminal.[] The foundry's records are recovered: the Ancient Platform can now be built here.
vesper.site.choice = [accent]Restore[] for {0}: {1}\n[accent]Dismantle[] once: {2} come out into its store, for belts or your unit. Then it is gone for good.
