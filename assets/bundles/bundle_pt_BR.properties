vesper.objective.drills = Construa 4 Perfuradoras Básicas em ferroprisma e carbono vítreo
vesper.objective.forge = Construa uma Fornalha Estrutural: ferroprisma + carbono vítreo viram liga
vesper.objective.turrets = Construa 2 Torres Cinéticas e abasteça-as com ferroprisma
vesper.objective.power = Construa um Gerador de Combustão e alimente-o com carbono vítreo
vesper.objective.assembler = Construa uma Montadora de Componentes: liga + sucata viram circuitos
vesper.objective.restore = Restaure o Reator Antigo (noroeste): entregue 300 de liga e 100 circuitos
vesper.objective.ignite = Acenda o reator quando suas defesas estiverem prontas (toque nele)
vesper.objective.survive = Sobreviva ao despertar: destrua as ondas finais
