vesper.activity.incoming.awakening.gates = Ancient machines waking at the fault gates: {1} arrive in {0}
vesper.activity.announce.awakening.gates = [scarlet]The basin awakens![] Ancient machines emerge at the fault gates in {0}s.
vesper.activity.toast.stirring = The basin stirs. Your industry is being noticed.
vesper.activity.toast.awakened = The basin has awakened.
vesper.activity.toast.emerged = Ancient machines have emerged!
vesper.activity.hint.ignite = Ignition powers your grid with {1}-{2} power/s (more at higher activity) and wakes about {0} ancient machines. Heavier industry wakes more.
vesper.activity.hint.stirring = Stirring: the ruins glow brighter. The heavier your industry when the reactor wakes, the larger the response.
vesper.activity.hint.awakened = Awakened: the reactor runs hotter, but patrols keep coming while industry stays this heavy.
vesper.activity.help = The planet notices what you build.\n\n[accent]Working industry[] (forges, engines, assemblers, refineries) slowly raises activity, up to Stirring. Ancient technology raises it much further: a restored reactor can push the basin into Awakened.\n\n[accent]Dormant[] (0-29): nothing stirs.\n[accent]Stirring[] (30-69): the ruins glow; the awakening response will be larger.\n[accent]Awakened[] (70-100): ancient machines emerge from the facility gates, then patrols while activity stays high.\n\nEvery response is announced with a countdown. A running reactor produces more power the higher the activity: risk and reward come from the same source.

