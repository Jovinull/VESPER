vesper.response.hint.dormant = Adormecida: máquinas de ressonância em x1. Acima de {0} elas aceleram.
vesper.response.hint.stirring = Agitada: máquinas de ressonância mais rápidas. A partir de {0}, começam os pulsos de ressonância.
vesper.response.hint.pulses = Pulsos de ressonância chegam com regularidade. Em {0} a bacia desperta e começam as patrulhas.
vesper.response.hint.awakened = Desperta: máquinas de ressonância no máximo, e as patrulhas crescem com o nível (no máximo {0} máquinas hostis ao mesmo tempo). Estabilizadores fazem baixar.
vesper.response.help = O planeta percebe o que você constrói, e paga por isso.\n\n[accent]O que sobe a atividade:[] indústria em funcionamento (até 50) e tecnologia antiga: um reator pronto, mais quando aceso, e um surto quando acende.\n[accent]O que baixa:[] torres de estabilização com energia e ligadas. Cada uma tira menos que a anterior, então acalmam a base mas nunca a silenciam. Toque numa torre para desligá-la e poupar energia.\n\n[accent]O que ela rende:[] máquinas de ressonância (extrator de cristal, ressonador experimental) aceleram acima de 30, até o dobro em 100. O reator também dá mais energia.\n[accent]O que ela custa:[] a partir de 50, pulsos de ressonância atingem suas máquinas de ressonância (avisados 20 s antes): dentro, elas aceleram, a indústria comum ao lado fica mais lenta, os estabilizadores ficam sobrecarregados e a atividade sobe por um tempo. Em 70 a bacia desperta: patrulhas saem dos portões, maiores e mais frequentes quanto mais alto o nível.\n[accent]O que protege:[] um Campo de Contenção, com energia e abastecido com núcleos de ressonância, afasta os pulsos das máquinas dentro do seu anel (nada desacelera, nenhum estabilizador fica sobrecarregado). Ele não baixa a atividade, e absorver cada pulso custa núcleos.\n\nQuieto e devagar, ou barulhento e rápido: a escolha é sua.
