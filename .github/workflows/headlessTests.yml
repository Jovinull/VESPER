name: Headless Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Run the harness suites on the official dedicated server
      run: |
        chmod +x ./gradlew
        ./gradlew runServer -Pharness=all -PharnessSpeed=3
    - name: Upload the harness report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: headless-report
        path: run/server/config/vesper-harness/report.txt
