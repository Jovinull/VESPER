mod.vesper.description = A derelict machine-planet slowly wakes as its ancient industry runs again. Alpha build: play First Awakening from Play > Custom Game.

item.vesper-ferroprism.name = Ferroprism
item.vesper-ferroprism.description = Iron that grew as rhombic prisms. The basic structural metal of The Silent Basin.
item.vesper-conductive-scrap.name = Conductive Scrap
item.vesper-conductive-scrap.description = Torn conduit with its copper core still intact, salvaged from the planet's buried machinery.
item.vesper-resonance-crystal.name = Resonance Crystal
item.vesper-resonance-crystal.description = A crystal that rings faintly when the planet stirs. Stores and channels resonance.
item.vesper-vitreous-carbon.name = Vitreous Carbon
item.vesper-vitreous-carbon.description = Black glassy carbon. Burns hot; used as fuel and as a reducing agent.
item.vesper-structural-alloy.name = Structural Alloy
item.vesper-structural-alloy.description = Ferroprism refined with vitreous carbon. The backbone of a frontier industry.
item.vesper-recovered-circuit.name = Recovered Circuit
item.vesper-recovered-circuit.description = Ancient circuitry, cleaned and reassembled. Its traces still glow under load.
item.vesper-resonance-core.name = Resonance Core
item.vesper-resonance-core.description = A tuned crystal sphere caged in alloy. Holds a stable resonance charge.
item.vesper-vitrified-compound.name = Vitrified Compound
item.vesper-vitrified-compound.description = Pressed glassy mineral blocks with resonant inclusions.

