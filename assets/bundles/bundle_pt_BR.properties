# campanha: o planeta VESPER e o Capítulo Um, The Silent Basin
planet.vesper-planet.name = VESPER
planet.vesper-planet.description = Um mundo industrial artificial, abandonado por seus construtores. Seus sistemas antigos começam a despertar com o retorno da atividade.
techtree.vesper = VESPER
sector.vesper-first-awakening.name = Primeiro Despertar
sector.vesper-first-awakening.description = The Silent Basin, Capítulo Um.\nUm reator abandonado espera no fim de um vale morto. Monte uma indústria, restaure o reator e acenda-o: a bacia vai responder.\n[lightgray]A expedição pousa com seus próprios suprimentos: 300 de ferroprisma e 120 de sucata.
sector.vesper-resonance-fault.name = Falha de Ressonância
sector.vesper-resonance-fault.description = The Silent Basin, Capítulo Um.\nUma falha de cristal de ressonância atravessa a bacia. Guarde o cristal no núcleo: o quanto você força o planeta para obtê-lo é escolha sua.\n[lightgray]A expedição pousa com seus próprios suprimentos: 900 de ferroprisma, 400 de sucata, 120 de liga e 150 circuitos.
sector.vesper-buried-foundry.name = A Fundição Soterrada
sector.vesper-buried-foundry.description = The Silent Basin, Capítulo Um.\nSob a poeira está uma fundição escavada. Investigue suas máquinas enterradas, restaure-as ou desmonte-as, e leia seu arquivo.\n[lightgray]A expedição pousa com seus próprios suprimentos: 800 de ferroprisma, 400 de sucata, 150 de liga e 200 circuitos.
sector.vesper-deep-signal.name = Sinal Profundo
sector.vesper-deep-signal.description = Algo muito abaixo da bacia está respondendo.\n[lightgray]Não disponível nesta versão.
vesper.deep.locked = Não disponível nesta versão
vesper.requirement.unavailable = Não disponível nesta versão
vesper.requirement.archive = Ler o arquivo da Fundição Soterrada
vesper.record.announce = [#36c8be]Registro recuperado: {0}[]\n[lightgray]{1}
vesper.record.reactor-seals.title = Selos do reator
vesper.record.reactor-seals.text = Os selos do reator foram fechados por dentro, um a um, em ordem. Ele não foi abandonado por acidente: alguém interrompeu sua operação de propósito.
vesper.record.resonance-network.title = Uma rede maior
vesper.record.resonance-network.text = A falha não termina onde a bacia termina. A ressonância corre sob ela como fiação, e cada máquina que você liga envia um sinal por ela.
vesper.record.containment.title = Padrão de contenção
vesper.record.containment.text = As máquinas que respondem não caçam. Cercam o que mais perturba a rede e depois silenciam: um sistema feito para conter e proteger, não para atacar.
vesper.record.restored-machine.title = Registro de manutenção
vesper.record.restored-machine.text = A máquina restaurada guardou seu registro. A última entrada manda selar todas as recuperadoras da fundição, "até que as obras inferiores silenciem".
vesper.record.dismantled-machine.title = Marcas no resgate
vesper.record.dismantled-machine.text = Cada peça dentro da carcaça traz a mesma marca dos selos do reator. A fundição e o reator foram desligados pelas mesmas mãos.
vesper.record.archive-index.title = Índice do arquivo
vesper.record.archive-index.text = Um índice parcial de uma rede selada: fundições, reatores e arquivos pelo planeta, todos fechados na mesma sequência. Uma entrada não tem lugar, só uma profundidade: CONTROLE CENTRAL.
vesper.record.deep-signal.title = Sinal de baixo
vesper.record.deep-signal.text = O último registro do arquivo se interrompe no meio da frase. Desde que a fundição despertou, um sinal sobe de muito abaixo da bacia, no próprio canal do arquivo: parte daquele sistema está ativa de novo.
vesper.secured.title = {0} protegido
vesper.secured.available = Agora disponível
vesper.secured.next = Próximo: abra o mapa do planeta e lance para {0}. O setor começa com seus próprios suprimentos.
vesper.chapter.title = Capítulo Um concluído
vesper.chapter.subtitle = The Silent Basin
vesper.chapter.text = Você despertou um reator desligado de propósito, aprendeu que a bacia responde como um sistema de contenção e recuperou o arquivo da fundição soterrada. Os registros apontam para um lugar: abaixo.
vesper.chapter.next = A região mais profunda está marcada no mapa do planeta. Ela não está disponível nesta versão.
vesper.archive = Arquivo
vesper.archive.title = Arquivo de VESPER
vesper.archive.unknown = ??? (ainda não encontrado)
vesper.intro.title = VESPER
vesper.intro.text = Um novo planeta está na lista: [#36c8be]VESPER[], um mundo artificial cujas máquinas estão despertando.\n\nA campanha começa pelo Capítulo Um, The Silent Basin, no Primeiro Despertar.
vesper.intro.go = Ir para VESPER
vesper.intro.later = Depois
