mod.vesper.description = Um planeta-máquina abandonado desperta lentamente quando sua indústria antiga volta a funcionar. Versão de prévia artística.

item.vesper-ferroprism.name = Ferroprisma
item.vesper-ferroprism.description = Ferro que cresceu em prismas romboidais. O metal estrutural básico de The Silent Basin.
item.vesper-conductive-scrap.name = Sucata Condutora
item.vesper-conductive-scrap.description = Conduítes partidos com o núcleo de cobre intacto, recuperados das máquinas enterradas do planeta.
item.vesper-resonance-crystal.name = Cristal de Ressonância
item.vesper-resonance-crystal.description = Um cristal que vibra levemente quando o planeta se agita. Armazena e conduz ressonância.
item.vesper-vitreous-carbon.name = Carbono Vítreo
item.vesper-vitreous-carbon.description = Carbono negro e vítreo. Queima intensamente; usado como combustível e agente redutor.
item.vesper-structural-alloy.name = Liga Estrutural
item.vesper-structural-alloy.description = Ferroprisma refinado com carbono vítreo. A espinha dorsal de uma indústria de fronteira.
item.vesper-recovered-circuit.name = Circuito Recuperado
item.vesper-recovered-circuit.description = Circuitos antigos, limpos e remontados. Suas trilhas ainda brilham sob carga.
item.vesper-resonance-core.name = Núcleo de Ressonância
item.vesper-resonance-core.description = Uma esfera de cristal afinada, presa em uma gaiola de liga. Mantém uma carga de ressonância estável.
item.vesper-vitrified-compound.name = Composto Vitrificado
item.vesper-vitrified-compound.description = Blocos de mineral vítreo prensado com inclusões ressonantes.

block.vesper-machine-basalt.name = Basalto Mecânico
block.vesper-scrap-soil.name = Solo de Sucata Compactada
block.vesper-vitrified-dust.name = Poeira Mineral Vitrificada
block.vesper-rusted-plating.name = Chapas Metálicas Oxidadas
block.vesper-ore-ferroprism.name = Minério de Ferroprisma
block.vesper-ore-conductive-scrap.name = Depósito de Sucata Condutora
block.vesper-ore-resonance-crystal.name = Veio de Cristal de Ressonância
block.vesper-ore-vitreous-carbon.name = Depósito de Carbono Vítreo

block.vesper-transit-belt.name = Esteira de Transporte
block.vesper-transit-belt.description = Move carga sobre um trilho de aço rebitado.
block.vesper-cargo-router.name = Distribuidor
block.vesper-cargo-router.description = Empurra a carga recebida pelas outras três saídas.
block.vesper-cargo-junction.name = Cruzamento
block.vesper-cargo-junction.description = Permite que duas linhas de esteira se cruzem sem misturar.
block.vesper-cargo-bridge.name = Ponte Logística
block.vesper-cargo-bridge.description = Leva carga por cima de terreno e construções entre dois pilares.
block.vesper-industrial-conduit.name = Conduto Industrial
block.vesper-industrial-conduit.description = Tubo pesado com flanges para líquidos.
block.vesper-resonance-link.name = Conector de Ressonância
block.vesper-resonance-link.description = Um pilar antigo recuperado que transmite energia por um feixe de ressonância.

block.vesper-survey-drill.name = Perfuradora Básica
block.vesper-survey-drill.description = Perfuradora compacta para ferroprisma e carbono vítreo.
block.vesper-reinforced-drill.name = Perfuradora Reforçada
block.vesper-reinforced-drill.description = Perfuratriz pesada e energizada, com caixas de engrenagem expostas. Minera depósitos mais duros e mais rápido.
block.vesper-scrap-collector.name = Coletor de Sucata
block.vesper-scrap-collector.description = Um anel giratório de eletroímãs que levanta sucata condutora do solo.
block.vesper-crystal-extractor.name = Extrator de Cristal
block.vesper-crystal-extractor.description = Pilares antigos concentram ressonância nos veios de cristal e os soltam.

block.vesper-structural-forge.name = Fornalha Estrutural
block.vesper-structural-forge.description = Fornalha refratária que funde ferroprisma com carbono vítreo em liga estrutural.
block.vesper-scrap-recycler.name = Recicladora Industrial
block.vesper-scrap-recycler.description = Trituradores gêmeos transformam sucata condutora de volta em ferroprisma.
block.vesper-alloy-refinery.name = Refinaria de Liga
block.vesper-alloy-refinery.description = Linha de cadinhos energizada. Produz liga estrutural com mais eficiência que a fornalha.
block.vesper-mineral-compressor.name = Compressor Mineral
block.vesper-mineral-compressor.description = Prensa hidráulica que forma composto vitrificado.
block.vesper-combustion-engine.name = Gerador de Combustão
block.vesper-combustion-engine.description = Motor de quatro cilindros que queima carga inflamável para gerar energia.
block.vesper-power-accumulator.name = Acumulador de Energia
block.vesper-power-accumulator.description = Banco de capacitores. Suas janelas passam do âmbar ao teal de ressonância conforme carrega.
block.vesper-experimental-resonator.name = Ressonador Experimental
block.vesper-experimental-resonator.description = Um núcleo antigo recuperado, preso em uma estrutura de fronteira. Afina cristais em núcleos de ressonância.
block.vesper-component-assembler.name = Montadora de Componentes
block.vesper-component-assembler.description = Braços de pórtico reconstroem circuitos antigos a partir de liga e sucata.

block.vesper-reinforced-wall.name = Muralha Reforçada
block.vesper-heavy-wall.name = Muralha Pesada
block.vesper-kinetic-turret.name = Torre Cinética
block.vesper-kinetic-turret.description = Canhão automático pesado. Dispara projéteis de ferroprisma ou munição perfurante de liga.
block.vesper-pulse-turret.name = Torre de Pulso
block.vesper-pulse-turret.description = Emissor de ressonância que dispara projéteis carregados.
block.vesper-ancient-platform.name = Plataforma Defensiva Antiga
block.vesper-ancient-platform.description = Uma plataforma recuperada dos construtores do planeta. Dispara uma longa lança de ressonância.

block.vesper-core-foothold.name = Núcleo: Posto Avançado
block.vesper-core-foothold.description = O núcleo de pouso da expedição.
block.vesper-derelict-reactor.name = Reator Antigo Abandonado
block.vesper-derelict-reactor.description = Um reator imenso, rasgado. Seu núcleo exposto ainda vaza ressonância.
block.vesper-stabilizer-pylon.name = Torre de Estabilização
block.vesper-stabilizer-pylon.description = Torre antiga que um dia manteve estável a ressonância do planeta.
block.vesper-data-terminal.name = Terminal de Dados
block.vesper-data-terminal.description = Um console antigo. Sua tela ainda rola uma escrita desconhecida.
block.vesper-recoverable-ruin.name = Ruína Industrial Recuperável
block.vesper-recoverable-ruin.description = Uma máquina antiga desmoronada, marcada para recuperação.

unit.vesper-scout-drone.name = Drone de Reconhecimento
unit.vesper-maintenance-drone.name = Drone de Manutenção
unit.vesper-ancient-sentinel.name = Sentinela Antiga
unit.vesper-rust-crawler.name = Aranha Mecânica
