block.vesper-transit-belt.name = Transit Belt
block.vesper-transit-belt.description = Moves cargo along a riveted steel track.
block.vesper-cargo-router.name = Cargo Router
block.vesper-cargo-router.description = Pushes incoming cargo out through its other three mouths.
block.vesper-cargo-junction.name = Cargo Junction
block.vesper-cargo-junction.description = Lets two belt lines cross without mixing.
block.vesper-cargo-bridge.name = Cargo Bridge
block.vesper-cargo-bridge.description = Carries cargo over terrain and buildings between two pylons.
block.vesper-industrial-conduit.name = Industrial Conduit
block.vesper-industrial-conduit.description = Heavy flanged pipe for liquids.
block.vesper-resonance-link.name = Resonance Link
block.vesper-resonance-link.description = A recovered ancient pylon that relays power through a resonance beam.

block.vesper-survey-drill.name = Survey Drill
block.vesper-survey-drill.description = Compact drill for ferroprism and vitreous carbon.
block.vesper-reinforced-drill.name = Reinforced Drill
block.vesper-reinforced-drill.description = Heavy powered bore with exposed gearboxes. Mines harder deposits faster.
block.vesper-scrap-collector.name = Scrap Collector
block.vesper-scrap-collector.description = A turning ring of electromagnets that lifts conductive scrap from the ground.
block.vesper-crystal-extractor.name = Crystal Extractor
block.vesper-crystal-extractor.description = Ancient pylons focus resonance into crystal veins and shake them loose. Mines faster as planetary activity rises.

block.vesper-structural-forge.name = Structural Forge
block.vesper-structural-forge.description = Refractory furnace that smelts ferroprism with vitreous carbon into structural alloy.
block.vesper-scrap-recycler.name = Scrap Recycler
block.vesper-scrap-recycler.description = Twin shredders strip conductive scrap back into ferroprism.
block.vesper-alloy-refinery.name = Alloy Refinery
block.vesper-alloy-refinery.description = Powered crucible line. Produces structural alloy more efficiently than the forge.
block.vesper-mineral-compressor.name = Mineral Compressor
block.vesper-mineral-compressor.description = Hydraulic press that forms vitrified compound.
block.vesper-combustion-engine.name = Combustion Engine
block.vesper-combustion-engine.description = Four-cylinder engine burning flammable cargo for power.
block.vesper-power-accumulator.name = Power Accumulator
block.vesper-power-accumulator.description = Capacitor bank. Its windows shift from amber to resonance teal as it charges.
block.vesper-experimental-resonator.name = Experimental Resonator
block.vesper-experimental-resonator.description = A recovered ancient core clamped into a frontier frame. Tunes crystals into resonance cores. Works faster as planetary activity rises.
block.vesper-component-assembler.name = Component Assembler
block.vesper-component-assembler.description = Gantry arms rebuild ancient circuitry from alloy and scrap.

block.vesper-reinforced-wall.name = Reinforced Wall
block.vesper-heavy-wall.name = Heavy Wall
block.vesper-kinetic-turret.name = Kinetic Turret
block.vesper-kinetic-turret.description = Heavy autocannon. Fires ferroprism slugs, or piercing alloy rounds.
block.vesper-pulse-turret.name = Pulse Turret
block.vesper-pulse-turret.description = Resonance emitter that fires charged bolts.
block.vesper-ancient-platform.name = Ancient Platform
block.vesper-ancient-platform.description = A recovered emplacement of the planet's builders. Fires a long resonance lance.

block.vesper-core-foothold.name = Core: Foothold
block.vesper-core-foothold.description = The landing core of the expedition.
block.vesper-derelict-reactor.name = Derelict Reactor
block.vesper-derelict-reactor.description = A vast reactor, torn open. Its exposed core still bleeds resonance. Feed it structural alloy and recovered circuits to prime it, then ignite it: it powers your grid, and wakes the basin.
block.vesper-stabilizer-pylon.name = Stabilizer Pylon
block.vesper-stabilizer-pylon.description = The builders' stabilizer, working again. Powered and switched on, it holds the basin's resonance down; each further stabilizer helps less than the last. Tap it to switch it on or off.
block.vesper-data-terminal.name = Data Terminal
block.vesper-data-terminal.description = An ancient console. Its screen still scrolls in an unknown script.
block.vesper-recoverable-ruin.name = Industrial Ruin
block.vesper-recoverable-ruin.description = A collapsed ancient machine, flagged for salvage.

