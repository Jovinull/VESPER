vesper.objective.fault-power = Get the extractors working: power them (combustion engines or the reactor) and belt the crystal to the core
vesper.objective.fault-store = Store resonance crystal in the core

block.vesper-survey-rig.name = Survey Rig
block.vesper-survey-rig.description = Field rig for industrial archaeology. Built near an ancient installation, it scans the nearest unexplored one in range, spending power and one recovered circuit per sample. The installation keeps the work: a lost rig loses nothing.
block.vesper-ancient-recoverer.name = Ancient Recoverer
block.vesper-ancient-recoverer.description = A buried machine of the builders. Survey it to learn what it does, then restore it into a working machine or dismantle it for a one-time salvage.
block.vesper-archive-terminal.name = Archive Terminal
block.vesper-archive-terminal.description = The foundry's records. Surveying it recovers a lost schematic for this site.
