vesper.foundry.victory = [accent]The Buried Foundry is yours.[] What the builders left now works for you.
vesper.foundry.complete = The Buried Foundry is yours.
vesper.foundry.hold = The fourth wave is holding: the foundry's guardians wait. Read the archive when your defenses are ready; it wakes them.
vesper.foundry.hold.toast = The waves have stopped. The foundry is waiting.
